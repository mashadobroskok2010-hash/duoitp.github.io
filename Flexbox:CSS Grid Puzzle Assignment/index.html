<title>Puzzle Assignment</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.grid-container {
    display: grid;
    grid-template-rows: auto auto auto auto auto;
    gap: 10px;
    padding: 10px;
}

.box {
    border: 2px solid black;
    padding: 10px;
}

header h1 {
    margin: 20px 0;
    font-size: 60px;
}

}

/* Общие настройки пазлов */
.puzzle {
    display: grid;
    justify-content: center;
    gap: 0;
}

.puzzle img {
    width: 100px;
    display: block;
}

/* Puzzle 1 */
.puzzle1 {
    grid-template-columns: repeat(4, 100px);
}

/* Puzzle 2 */
.puzzle2 {
    grid-template-columns: repeat(4, 100px);
}

/* Puzzle 3 */
.puzzle3 {
    grid-template-columns: repeat(3, 100px);
}

footer p {
    font-size: 32px;
}
</style>
