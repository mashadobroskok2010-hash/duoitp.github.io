<!DOCTYPE html>
<html>
<head>
    <title>My Busy Day Schedule</title>

    <style>
        /* Table */
        table {
            border-collapse: collapse;
            width: 70%;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }

        /* Table headers */
        th {
            background-color: lightblue;
            color: black;
            padding: 10px;
        }

        /* All table cells */
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        /* Row styling */
        .important-row {
            background-color: lightyellow;
        }

        /* Column styling */
        .time-column {
            background-color: lightgray;
            font-weight: bold;
        }

        caption {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<table>
    <caption>My Busy Day Schedule</caption>

    <colgroup>
        <col class="time-column">
        <col>
    </colgroup>

    <tr>
        <th>Time</th>
        <th>Event</th>
    </tr>

    <tr>
        <td>7:00 AM</td>
        <td>Wake up</td>
    </tr>

    <tr>
        <td>7:30 AM</td>
        <td>Breakfast</td>
    </tr>

    <tr class="important-row">
        <td>8:00 AM</td>
        <td>Online Classes</td>
    </tr>

    <tr>
        <td>11:00 AM</td>
        <td>Study Mathematics</td>
    </tr>

    <tr>
        <td>1:00 PM</td>
        <td>Lunch</td>
    </tr>

    <tr class="important-row">
        <td>2:00 PM</td>
        <td>Complete Homework</td>
    </tr>

    <tr>
        <td>5:00 PM</td>
        <td>Exercise</td>
    </tr>

    <tr>
        <td>6:30 PM</td>
        <td>Dinner</td>
    </tr>

    <tr>
        <td>8:00 PM</td>
        <td>Read a Book</td>
    </tr>
</table>

</body>
</html>
